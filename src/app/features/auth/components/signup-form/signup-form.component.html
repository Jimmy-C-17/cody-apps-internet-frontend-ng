
<div class="flex flex-col justify-center flex-1 w-full max-w-md mx-auto">
  <div>
    <div class="mb-5 sm:mb-8">
      <h1 class="mb-2 font-semibold text-gray-800 text-title-sm dark:text-white/90 sm:text-title-md">
        Registro de Usuario
      </h1>
      <p class="text-sm text-gray-500 dark:text-gray-400">
        Ingresa tus datos para registrarte.
      </p>
    </div>

    <form (ngSubmit)="onSignUp()">
      <div class="space-y-5">
        @if (errorMessage) {
          <div class="p-3 text-sm text-red-600 bg-red-100 rounded-lg dark:bg-red-500/10 dark:text-red-400">
            {{ errorMessage }}
          </div>
        }
        <!-- Username -->
        <div class="flex flex-col gap-2">
          <label class="block text-sm font-medium text-gray-700 dark:text-gray-300">Usuario <span class="text-error-500">*</span></label>
          <input 
            pInputText 
            type="text" 
            placeholder="Ingresa tu nombre de usuario" 
            [(ngModel)]="username" 
            name="username" 
            required 
            [disabled]="isLoading"
            class="w-full px-4 py-3 bg-transparent border border-gray-200 rounded-lg dark:border-white/10 text-gray-800 dark:text-white/90 focus:border-brand-500 focus:outline-none focus:ring-1 focus:ring-brand-500"
          />
        </div>
        <!-- Email -->
        <div class="flex flex-col gap-2">
          <label class="block text-sm font-medium text-gray-700 dark:text-gray-300">Email <span class="text-error-500">*</span></label>
          <input 
            pInputText 
            type="email" 
            placeholder="Ingresa tu email" 
            [(ngModel)]="email" 
            name="email" 
            required 
            [disabled]="isLoading"
            class="w-full px-4 py-3 bg-transparent border border-gray-200 rounded-lg dark:border-white/10 text-gray-800 dark:text-white/90 focus:border-brand-500 focus:outline-none focus:ring-1 focus:ring-brand-500"
          />
        </div>
        <!-- Password -->
        <div class="flex flex-col gap-2">
          <label class="block text-sm font-medium text-gray-700 dark:text-gray-300">Contraseña <span class="text-error-500">*</span></label>
          <p-password 
            [(ngModel)]="password" 
            name="password" 
            [toggleMask]="true" 
            [feedback]="true"
            weakLabel="Débil"
            mediumLabel="Media"
            strongLabel="Fuerte"
            promptLabel="Elige una contraseña"
            placeholder="Ingresa tu contraseña"
            [disabled]="isLoading">
          </p-password>
        </div>
        <!-- Checkbox -->
        <div class="flex items-center gap-3">
          <p-checkbox [(ngModel)]="isChecked" name="isChecked" [binary]="true" inputId="terms"></p-checkbox>
          <label for="terms" class="inline-block font-normal text-gray-500 dark:text-gray-400 cursor-pointer">
            Al crear una cuenta aceptas los
            <span class="text-gray-800 dark:text-white/90">
              Términos y Condiciones,
            </span>
            y nuestra
            <span class="text-gray-800 dark:text-white">
              Política de Privacidad
            </span>
          </label>
        </div>
        <!-- Button -->
        <div>
          <p-button 
            type="submit" 
            [loading]="isLoading" 
            label="Registrarse"
            styleClass="w-full bg-brand-500 hover:bg-brand-600 border-none py-3"
            [disabled]="isLoading">
          </p-button>
        </div>
      </div>
    </form>

    <div class="mt-5">
      <p class="text-sm font-normal text-center text-gray-700 dark:text-gray-400 sm:text-start">
        ¿Ya tienes una cuenta?
        <a routerLink="/signin" class="text-brand-500 hover:text-brand-600 dark:text-brand-400">
          Iniciar Sesión
        </a>
      </p>
    </div>
  </div>
</div>
