  <div class="flex flex-col justify-center flex-1 w-full max-w-md mx-auto">
    <div>
      <div class="mb-5 sm:mb-8">
        <h1 class="mb-2 font-semibold text-gray-800 text-title-sm dark:text-white/90 sm:text-title-md">
          Iniciar Sesión
        </h1>
        <p class="text-sm text-gray-500 dark:text-gray-400">
          Ingresa tus credenciales para continuar.
        </p>
      </div>

      <!-- Form -->
      <form (ngSubmit)="onSignIn()" class="space-y-6">
        @if (errorMessage) {
          <div class="p-3 text-sm text-red-600 bg-red-100 rounded-lg dark:bg-red-500/10 dark:text-red-400">
            {{ errorMessage }}
          </div>
        }

        <div class="flex flex-col gap-2">
          <label class="block text-sm font-medium text-gray-700 dark:text-gray-300">Usuario <span class="text-error-500">*</span></label>
          <input 
            pInputText 
            type="text" 
            placeholder="admin" 
            [(ngModel)]="email" 
            name="email" 
            required 
            [disabled]="isLoading"
            class="w-full"
          />
        </div>

        <div class="flex flex-col gap-2">
          <label class="block text-sm font-medium text-gray-700 dark:text-gray-300">Contraseña <span class="text-error-500">*</span></label>
          <p-password 
            [(ngModel)]="password" 
            name="password" 
            [toggleMask]="true" 
            [feedback]="false"
            placeholder="Ingresa tu contraseña"
            [disabled]="isLoading"
            styleClass="w-full"
            [inputStyle]="{'width':'100%'}">
          </p-password>
        </div>

        <p-button 
          type="submit" 
          [loading]="isLoading" 
          label="Ingresar"
          styleClass="w-full"
          severity="primary"
          [disabled]="isLoading">
        </p-button>
      </form>

      <div class="mt-5 text-center">
        <p class="text-sm text-gray-500 dark:text-gray-400">
          ¿No tienes una cuenta? 
          <a routerLink="/signup" class="text-brand-500 hover:text-brand-600 dark:hover:text-brand-400 font-medium transition-colors">Regístrate aquí</a>
        </p>
      </div>
    </div>
  </div>
